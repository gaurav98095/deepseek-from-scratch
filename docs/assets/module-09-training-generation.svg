<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="250" viewBox="0 0 1040 250" role="img" aria-labelledby="title desc">
  <title id="title">Dense language model training and generation lifecycle</title>
  <desc id="desc">Token batches flow through forward loss and backward optimization during training, then a prompt flows through logits and next-token selection during generation.</desc>
  <rect width="1040" height="250" rx="20" fill="#0f172a"/>
  <text x="520" y="34" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="700">One model, two execution loops</text>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <rect x="38" y="78" width="190" height="70" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="133" y="108" fill="#bae6fd">Token batch</text><text x="133" y="132" fill="#e2e8f0">inputs + shifted targets</text>
    <rect x="285" y="78" width="190" height="70" rx="13" fill="#1e293b" stroke="#34d399" stroke-width="2"/><text x="380" y="108" fill="#bbf7d0">Forward pass</text><text x="380" y="132" fill="#e2e8f0">logits → loss</text>
    <rect x="532" y="78" width="190" height="70" rx="13" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text x="627" y="108" fill="#fef3c7">Backward + AdamW</text><text x="627" y="132" fill="#e2e8f0">update parameters</text>
    <rect x="779" y="78" width="223" height="70" rx="13" fill="#1e293b" stroke="#fb7185" stroke-width="2"/><text x="890" y="108" fill="#fecdd3">Generation</text><text x="890" y="132" fill="#e2e8f0">prompt → next token loop</text>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2"><path d="M228 113h57"/><path d="M475 113h57"/><path d="M722 113h57"/></g>
  <g fill="#94a3b8"><path d="M275 113l-9-6v12z"/><path d="M522 113l-9-6v12z"/><path d="M769 113l-9-6v12z"/></g>
  <path d="M627 174v31H133V148" fill="none" stroke="#64748b" stroke-dasharray="6 5" stroke-width="2"/>
  <path d="M133 205l-8-10h16z" fill="#64748b"/>
  <text x="520" y="229" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Training changes weights; generation reuses fixed weights to choose tokens autoregressively</text>
</svg>
