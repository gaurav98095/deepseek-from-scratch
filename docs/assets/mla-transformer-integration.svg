<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="title desc">
  <title id="title">MLA integrated into a Transformer block</title>
  <desc id="desc">MLA replaces standard attention inside the first residual sublayer while RMSNorm and SwiGLU remain unchanged.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="980" height="330" rx="20" fill="#f8fafc"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="490" y="36" font-size="23" font-weight="700" fill="#0f172a">DeepSeek-style dense block</text>
    <rect x="30" y="120" width="120" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="90" y="153" font-size="17" font-weight="600" fill="#1e3a8a">Input x</text>
    <text x="90" y="178" font-size="15" fill="#1e3a8a">[B, T, D]</text>
    <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
      <line x1="150" y1="160" x2="205" y2="160"/>
      <line x1="350" y1="160" x2="415" y2="160"/>
      <line x1="575" y1="160" x2="640" y2="160"/>
      <line x1="800" y1="160" x2="855" y2="160"/>
    </g>
    <rect x="205" y="120" width="145" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="277" y="153" font-size="17" font-weight="600" fill="#5b21b6">RMSNorm 1</text>
    <text x="277" y="178" font-size="15" fill="#5b21b6">pre-normalize</text>
    <rect x="415" y="100" width="160" height="120" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="495" y="137" font-size="18" font-weight="700" fill="#9a3412">MLA</text>
    <text x="495" y="164" font-size="15" fill="#9a3412">low-rank Q/KV</text>
    <text x="495" y="188" font-size="15" fill="#9a3412">decoupled RoPE</text>
    <rect x="640" y="120" width="160" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="720" y="153" font-size="17" font-weight="600" fill="#166534">+ residual</text>
    <text x="720" y="178" font-size="15" fill="#166534">h = x + MLA(...)</text>
    <rect x="855" y="120" width="95" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="902" y="153" font-size="16" font-weight="600" fill="#075985">RMSNorm</text>
    <text x="902" y="178" font-size="15" fill="#075985">+ SwiGLU</text>
    <path d="M90 200 C90 280, 720 280, 720 200" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="490" y="290" font-size="16" fill="#475569">the FFN and both residual paths remain unchanged</text>
  </g>
</svg>
