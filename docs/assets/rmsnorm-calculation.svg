<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="620" viewBox="0 0 1450 620" role="img" aria-labelledby="title desc">
  <title id="title">RMSNorm calculation flow</title>
  <desc id="desc">An input vector is squared, averaged, stabilized with epsilon, multiplied by the inverse square root, and scaled by learned gamma weights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="calc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#047857"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7e22ce"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#cbd5e1"/></marker>
    <style>
      .title { font: 700 31px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .tiny { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1450" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1330" cy="70" r="190" fill="#38bdf8" opacity=".08"/>
  <circle cx="70" cy="550" r="170" fill="#f472b6" opacity=".08"/>
  <text x="70" y="65" class="title">RMSNorm controls activation scale</text>
  <text x="70" y="98" class="subtitle">Each token vector is normalized across its hidden dimension, then scaled by learned weights.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="210" width="200" height="140" rx="20" fill="url(#input)"/>
    <text x="160" y="253" text-anchor="middle" class="label">Input x</text>
    <text x="160" y="286" text-anchor="middle" class="small">[2, 4]</text>
    <text x="160" y="316" text-anchor="middle" class="small">[2, 4, 6, 8]</text>

    <rect x="330" y="210" width="200" height="140" rx="20" fill="url(#calc)"/>
    <text x="430" y="253" text-anchor="middle" class="label">Square + mean</text>
    <text x="430" y="286" text-anchor="middle" class="small">mean(x²)</text>
    <text x="430" y="316" text-anchor="middle" class="small">average energy</text>

    <rect x="600" y="210" width="200" height="140" rx="20" fill="url(#calc)"/>
    <text x="700" y="253" text-anchor="middle" class="label">Add ε</text>
    <text x="700" y="286" text-anchor="middle" class="small">mean(x²) + ε</text>
    <text x="700" y="316" text-anchor="middle" class="small">numerical stability</text>

    <rect x="870" y="210" width="200" height="140" rx="20" fill="url(#calc)"/>
    <text x="970" y="253" text-anchor="middle" class="label">Inverse RMS</text>
    <text x="970" y="286" text-anchor="middle" class="small">1 / √value</text>
    <text x="970" y="316" text-anchor="middle" class="small">normalize x</text>

    <rect x="1140" y="210" width="250" height="140" rx="20" fill="url(#output)"/>
    <text x="1265" y="253" text-anchor="middle" class="label">Output y</text>
    <text x="1265" y="286" text-anchor="middle" class="small">normalized x ⊙ γ</text>
    <text x="1265" y="316" text-anchor="middle" class="tiny">learned feature scaling</text>
  </g>

  <path d="M260 280 H330" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M530 280 H600" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 280 H870" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1070 280 H1140" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(210 465)">
    <rect width="1030" height="70" rx="16" fill="#0f172a" fill-opacity=".6" stroke="#94a3b8" stroke-opacity=".35"/>
    <text x="515" y="29" text-anchor="middle" class="label" font-size="17">RMSNorm does not subtract the mean</text>
    <text x="515" y="52" text-anchor="middle" class="small">It controls root-mean-square magnitude while preserving the vector's directional information.</text>
  </g>
</svg>
