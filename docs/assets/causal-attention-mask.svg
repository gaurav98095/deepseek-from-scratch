<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">Causal attention mask</title>
  <desc id="desc">A lower triangular attention matrix shows that each token can read itself and earlier tokens, but not future tokens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <style>
      .title { font: 700 31px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .tiny { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1100" height="700" rx="28" fill="url(#bg)"/>
  <text x="55" y="62" class="title">Causal masking blocks future information</text>
  <text x="55" y="95" class="subtitle">Rows are query positions; columns are key positions that a query may read.</text>

  <text x="478" y="145" text-anchor="middle" class="label">Key position</text>
  <text x="190" y="385" text-anchor="middle" class="label" transform="rotate(-90 190 385)">Query position</text>

  <g transform="translate(300 180)">
    <rect x="0" y="0" width="88" height="88" fill="#047857"/><rect x="90" y="0" width="88" height="88" fill="#7f1d1d"/><rect x="180" y="0" width="88" height="88" fill="#7f1d1d"/><rect x="270" y="0" width="88" height="88" fill="#7f1d1d"/>
    <rect x="0" y="90" width="88" height="88" fill="#047857"/><rect x="90" y="90" width="88" height="88" fill="#047857"/><rect x="180" y="90" width="88" height="88" fill="#7f1d1d"/><rect x="270" y="90" width="88" height="88" fill="#7f1d1d"/>
    <rect x="0" y="180" width="88" height="88" fill="#047857"/><rect x="90" y="180" width="88" height="88" fill="#047857"/><rect x="180" y="180" width="88" height="88" fill="#047857"/><rect x="270" y="180" width="88" height="88" fill="#7f1d1d"/>
    <rect x="0" y="270" width="88" height="88" fill="#047857"/><rect x="90" y="270" width="88" height="88" fill="#047857"/><rect x="180" y="270" width="88" height="88" fill="#047857"/><rect x="270" y="270" width="88" height="88" fill="#047857"/>
    <g class="label">
      <text x="44" y="54" text-anchor="middle">✓</text><text x="134" y="54" text-anchor="middle">×</text><text x="224" y="54" text-anchor="middle">×</text><text x="314" y="54" text-anchor="middle">×</text>
      <text x="44" y="144" text-anchor="middle">✓</text><text x="134" y="144" text-anchor="middle">✓</text><text x="224" y="144" text-anchor="middle">×</text><text x="314" y="144" text-anchor="middle">×</text>
      <text x="44" y="234" text-anchor="middle">✓</text><text x="134" y="234" text-anchor="middle">✓</text><text x="224" y="234" text-anchor="middle">✓</text><text x="314" y="234" text-anchor="middle">×</text>
      <text x="44" y="324" text-anchor="middle">✓</text><text x="134" y="324" text-anchor="middle">✓</text><text x="224" y="324" text-anchor="middle">✓</text><text x="314" y="324" text-anchor="middle">✓</text>
    </g>
    <g class="small">
      <text x="44" y="-18" text-anchor="middle">0</text><text x="134" y="-18" text-anchor="middle">1</text><text x="224" y="-18" text-anchor="middle">2</text><text x="314" y="-18" text-anchor="middle">3</text>
      <text x="-20" y="54" text-anchor="middle">0</text><text x="-20" y="144" text-anchor="middle">1</text><text x="-20" y="234" text-anchor="middle">2</text><text x="-20" y="324" text-anchor="middle">3</text>
    </g>
  </g>

  <g transform="translate(760 215)">
    <rect width="250" height="90" rx="16" fill="#065f46" stroke="#6ee7b7" stroke-opacity=".65"/>
    <text x="125" y="37" text-anchor="middle" class="label">Allowed</text>
    <text x="125" y="64" text-anchor="middle" class="small">current and earlier tokens</text>
    <rect y="120" width="250" height="90" rx="16" fill="#7f1d1d" stroke="#fca5a5" stroke-opacity=".65"/>
    <text x="125" y="157" text-anchor="middle" class="label">Blocked</text>
    <text x="125" y="184" text-anchor="middle" class="small">future tokens → −∞ → 0</text>
  </g>

  <text x="550" y="635" text-anchor="middle" class="small">The mask is added to attention scores before softmax.</text>
</svg>
