<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="680" viewBox="0 0 1450 680" role="img" aria-labelledby="title desc">
  <title id="title">Query key value attention flow</title>
  <desc id="desc">The current token creates a query, every visible token provides a key and value, dot products create weights, and weighted values produce the contextual output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#164e63"/></linearGradient>
    <linearGradient id="query" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#047857"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="value" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7e22ce"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#cbd5e1"/></marker>
    <style>
      .title { font: 700 31px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .tiny { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1450" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1330" cy="75" r="190" fill="#38bdf8" opacity=".08"/>
  <circle cx="70" cy="600" r="180" fill="#a78bfa" opacity=".08"/>
  <text x="70" y="65" class="title">How one token gathers context</text>
  <text x="70" y="98" class="subtitle">Q asks, K matches, V contributes, and the weighted sum becomes a contextual representation.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="230" height="140" rx="20" fill="url(#query)"/>
    <text x="185" y="235" text-anchor="middle" class="label">Query Q</text>
    <text x="185" y="267" text-anchor="middle" class="small">current token: milk</text>
    <text x="185" y="296" text-anchor="middle" class="tiny">what should I attend to?</text>

    <rect x="400" y="150" width="245" height="95" rx="18" fill="url(#key)"/>
    <text x="522" y="190" text-anchor="middle" class="label">Keys K</text>
    <text x="522" y="218" text-anchor="middle" class="small">cat · drank · milk</text>
    <rect x="400" y="270" width="245" height="95" rx="18" fill="url(#value)"/>
    <text x="522" y="310" text-anchor="middle" class="label">Values V</text>
    <text x="522" y="338" text-anchor="middle" class="small">information to combine</text>

    <rect x="750" y="190" width="245" height="140" rx="20" fill="#334155" stroke="#cbd5e1" stroke-opacity=".55"/>
    <text x="872" y="235" text-anchor="middle" class="label">Scores → weights</text>
    <text x="872" y="267" text-anchor="middle" class="small">QKᵀ / √dₖ → softmax</text>
    <text x="872" y="296" text-anchor="middle" class="tiny">weights sum to 1</text>

    <rect x="1100" y="190" width="280" height="140" rx="20" fill="url(#output)"/>
    <text x="1240" y="235" text-anchor="middle" class="label">Contextual output</text>
    <text x="1240" y="267" text-anchor="middle" class="small">weighted sum of V</text>
    <text x="1240" y="296" text-anchor="middle" class="tiny">information from visible tokens</text>
  </g>

  <path d="M300 260 H750" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M645 198 H750" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M645 318 H750" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M995 260 H1100" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="525" y="125" text-anchor="middle" class="tiny">compare Q with every visible K</text>
  <text x="1045" y="240" text-anchor="middle" class="tiny">apply weights to V</text>

  <g transform="translate(190 475)">
    <rect width="1070" height="72" rx="16" fill="#0f172a" fill-opacity=".6" stroke="#94a3b8" stroke-opacity=".35"/>
    <text x="535" y="29" text-anchor="middle" class="label" font-size="17">Q, K, and V are learned numerical projections</text>
    <text x="535" y="52" text-anchor="middle" class="small">They do not contain human-readable questions, keys, or meanings.</text>
  </g>
</svg>
