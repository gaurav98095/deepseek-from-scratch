<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Top-k routing score matrix</title>
  <desc id="desc">Four token rows contain four expert scores, with the two highest scores highlighted in each row.</desc>
  <rect width="760" height="300" rx="20" fill="#0f172a"/>
  <text x="380" y="30" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="700">Sigmoid scores → top-2 selection</text>
  <text x="190" y="70" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Token</text>
  <g fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15" text-anchor="middle"><text x="320" y="70">E0</text><text x="410" y="70">E1</text><text x="500" y="70">E2</text><text x="590" y="70">E3</text></g>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="190" y="115" fill="#e2e8f0">T0</text><text x="190" y="155" fill="#e2e8f0">T1</text><text x="190" y="195" fill="#e2e8f0">T2</text><text x="190" y="235" fill="#e2e8f0">T3</text>
    <g fill="#1e293b" stroke="#475569"><rect x="280" y="88" width="80" height="34" rx="6"/><rect x="370" y="88" width="80" height="34" rx="6"/><rect x="460" y="88" width="80" height="34" rx="6"/><rect x="550" y="88" width="80" height="34" rx="6"/><rect x="280" y="128" width="80" height="34" rx="6"/><rect x="370" y="128" width="80" height="34" rx="6"/><rect x="460" y="128" width="80" height="34" rx="6"/><rect x="550" y="128" width="80" height="34" rx="6"/><rect x="280" y="168" width="80" height="34" rx="6"/><rect x="370" y="168" width="80" height="34" rx="6"/><rect x="460" y="168" width="80" height="34" rx="6"/><rect x="550" y="168" width="80" height="34" rx="6"/><rect x="280" y="208" width="80" height="34" rx="6"/><rect x="370" y="208" width="80" height="34" rx="6"/><rect x="460" y="208" width="80" height="34" rx="6"/><rect x="550" y="208" width="80" height="34" rx="6"/></g>
    <g fill="#fef3c7" stroke="#f59e0b" stroke-width="2"><rect x="370" y="88" width="80" height="34" rx="6"/><rect x="550" y="88" width="80" height="34" rx="6"/><rect x="370" y="128" width="80" height="34" rx="6"/><rect x="460" y="128" width="80" height="34" rx="6"/><rect x="280" y="168" width="80" height="34" rx="6"/><rect x="550" y="168" width="80" height="34" rx="6"/><rect x="460" y="208" width="80" height="34" rx="6"/><rect x="550" y="208" width="80" height="34" rx="6"/></g>
    <g fill="#e2e8f0"><text x="320" y="110">0.2</text><text x="410" y="110">0.8</text><text x="500" y="110">0.1</text><text x="590" y="110">0.7</text><text x="320" y="150">0.4</text><text x="410" y="150">0.6</text><text x="500" y="150">0.75</text><text x="590" y="150">0.3</text><text x="320" y="190">0.9</text><text x="410" y="190">0.2</text><text x="500" y="190">0.1</text><text x="590" y="190">0.85</text><text x="320" y="230">0.2</text><text x="410" y="230">0.1</text><text x="500" y="230">0.65</text><text x="590" y="230">0.8</text></g>
  </g>
  <text x="380" y="275" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Highlighted cells are dispatched; selected scores are normalized before aggregation</text>
</svg>
