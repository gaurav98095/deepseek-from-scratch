<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Pretraining data preparation pipeline</title>
  <desc id="desc">FineWeb-Edu documents are streamed, cleaned, split, tokenized, marked with EOS, and written to train and validation binary files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="process" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#047857"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="storage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7e22ce"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#cbd5e1"/></marker>
    <style>
      .title { font: 700 31px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .tiny { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1500" height="650" rx="28" fill="url(#bg)"/>
  <circle cx="1370" cy="90" r="190" fill="#38bdf8" opacity=".08"/>
  <circle cx="80" cy="570" r="180" fill="#a78bfa" opacity=".08"/>
  <text x="70" y="65" class="title">From web documents to training tokens</text>
  <text x="70" y="98" class="subtitle">Preprocessing turns a large stream of text into compact, reproducible binary arrays.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="210" width="190" height="125" rx="18" fill="url(#source)"/>
    <text x="155" y="253" text-anchor="middle" class="label">FineWeb-Edu</text>
    <text x="155" y="281" text-anchor="middle" class="small">web documents</text>
    <text x="155" y="305" text-anchor="middle" class="tiny">streamed records</text>

    <rect x="290" y="210" width="190" height="125" rx="18" fill="url(#process)"/>
    <text x="385" y="253" text-anchor="middle" class="label">Clean</text>
    <text x="385" y="281" text-anchor="middle" class="small">normalize + filter</text>
    <text x="385" y="305" text-anchor="middle" class="tiny">remove unusable text</text>

    <rect x="520" y="210" width="190" height="125" rx="18" fill="url(#process)"/>
    <text x="615" y="253" text-anchor="middle" class="label">Split</text>
    <text x="615" y="281" text-anchor="middle" class="small">train / validation</text>
    <text x="615" y="305" text-anchor="middle" class="tiny">document-level split</text>

    <rect x="750" y="210" width="190" height="125" rx="18" fill="url(#process)"/>
    <text x="845" y="253" text-anchor="middle" class="label">Tokenize</text>
    <text x="845" y="281" text-anchor="middle" class="small">byte-level BPE</text>
    <text x="845" y="305" text-anchor="middle" class="tiny">text → integer IDs</text>

    <rect x="980" y="210" width="190" height="125" rx="18" fill="url(#process)"/>
    <text x="1075" y="253" text-anchor="middle" class="label">Add EOS</text>
    <text x="1075" y="281" text-anchor="middle" class="small">mark boundaries</text>
    <text x="1075" y="305" text-anchor="middle" class="tiny">one per document</text>

    <rect x="1210" y="160" width="220" height="105" rx="18" fill="url(#storage)"/>
    <text x="1320" y="202" text-anchor="middle" class="label">train.bin</text>
    <text x="1320" y="231" text-anchor="middle" class="small">training token IDs</text>

    <rect x="1210" y="300" width="220" height="105" rx="18" fill="url(#storage)"/>
    <text x="1320" y="342" text-anchor="middle" class="label">val.bin</text>
    <text x="1320" y="371" text-anchor="middle" class="small">held-out token IDs</text>
  </g>

  <path d="M250 272 H290" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M480 272 H520" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M710 272 H750" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M940 272 H980" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1170 272 H1210 V212" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1170 272 H1210 V352" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(235 500)">
    <rect width="1030" height="70" rx="16" fill="#0f172a" fill-opacity=".6" stroke="#94a3b8" stroke-opacity=".35"/>
    <text x="515" y="29" text-anchor="middle" class="label" font-size="17">Preparation happens once per dataset version</text>
    <text x="515" y="52" text-anchor="middle" class="small">Training batches are built later by reading slices from these serialized token arrays.</text>
  </g>
</svg>
