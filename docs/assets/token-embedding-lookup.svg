<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Token IDs mapped to embedding vectors</title>
  <desc id="desc">Five token IDs are looked up in an embedding table and become five learned vectors with 256 dimensions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="token" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="vector" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#cbd5e1"/>
    </marker>
    <style>
      .title { font: 700 31px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 700 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .tiny { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1270" cy="80" r="190" fill="#38bdf8" opacity=".08"/>
  <circle cx="80" cy="570" r="170" fill="#f472b6" opacity=".08"/>

  <text x="70" y="65" class="title">Token IDs become learned vectors</text>
  <text x="70" y="98" class="subtitle">An embedding lookup changes discrete IDs into continuous hidden states.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="235" height="230" rx="20" fill="#172554" stroke="#60a5fa" stroke-opacity=".6"/>
    <text x="187" y="235" text-anchor="middle" class="label">Token IDs</text>
    <text x="187" y="263" text-anchor="middle" class="small">input shape: [5]</text>
    <g transform="translate(105 292)">
      <rect width="165" height="38" rx="10" fill="url(#token)"/>
      <text x="82" y="25" text-anchor="middle" class="label">15</text>
      <rect y="45" width="165" height="38" rx="10" fill="url(#token)"/>
      <text x="82" y="70" text-anchor="middle" class="label">82</text>
      <rect y="90" width="165" height="38" rx="10" fill="url(#token)"/>
      <text x="82" y="115" text-anchor="middle" class="label">7</text>
      <rect y="135" width="165" height="38" rx="10" fill="url(#token)"/>
      <text x="82" y="160" text-anchor="middle" class="label">104</text>
    </g>
    <text x="187" y="393" text-anchor="middle" class="tiny">… plus the fifth token</text>

    <rect x="490" y="145" width="330" height="320" rx="20" fill="#1e1b4b" stroke="#c084fc" stroke-opacity=".65"/>
    <text x="655" y="190" text-anchor="middle" class="label">Embedding table</text>
    <text x="655" y="218" text-anchor="middle" class="small">[vocabulary size, 256]</text>
    <g transform="translate(530 250)">
      <rect width="250" height="34" rx="8" fill="#4c1d95"/>
      <text x="125" y="23" text-anchor="middle" class="small">row 15 → vector</text>
      <rect y="45" width="250" height="34" rx="8" fill="#6b21a8"/>
      <text x="125" y="68" text-anchor="middle" class="small">row 82 → vector</text>
      <rect y="90" width="250" height="34" rx="8" fill="#7e22ce"/>
      <text x="125" y="113" text-anchor="middle" class="small">row 7 → vector</text>
      <rect y="135" width="250" height="34" rx="8" fill="#9333ea"/>
      <text x="125" y="158" text-anchor="middle" class="small">row 104 → vector</text>
      <rect y="180" width="250" height="34" rx="8" fill="#a855f7"/>
      <text x="125" y="203" text-anchor="middle" class="small">row 21 → vector</text>
    </g>

    <rect x="1005" y="190" width="325" height="230" rx="20" fill="#500724" stroke="#f472b6" stroke-opacity=".65"/>
    <text x="1167" y="235" text-anchor="middle" class="label">Embedding vectors</text>
    <text x="1167" y="263" text-anchor="middle" class="small">output shape: [5, 256]</text>
    <g transform="translate(1050 305)">
      <rect width="240" height="20" rx="7" fill="url(#vector)"/>
      <rect y="28" width="240" height="20" rx="7" fill="url(#vector)" opacity=".9"/>
      <rect y="56" width="240" height="20" rx="7" fill="url(#vector)" opacity=".8"/>
      <rect y="84" width="240" height="20" rx="7" fill="url(#vector)" opacity=".7"/>
      <rect y="112" width="240" height="20" rx="7" fill="url(#vector)" opacity=".6"/>
    </g>
    <text x="1167" y="382" text-anchor="middle" class="tiny">one learned vector per token</text>
  </g>

  <path d="M305 305 H490" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M820 305 H1005" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="397" y="285" text-anchor="middle" class="tiny">lookup</text>
  <text x="912" y="285" text-anchor="middle" class="tiny">return selected rows</text>

  <text x="700" y="545" text-anchor="middle" class="small">For a batch of two sequences: [2, 5] → [2, 5, 256]</text>
  <text x="700" y="575" text-anchor="middle" class="tiny">The embedding table is learned during training; it is the first representation inside the model.</text>
</svg>
