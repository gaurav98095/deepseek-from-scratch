<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">MLA low-rank query and KV projections</title>
  <desc id="desc">A hidden state branches into compressed query and compressed KV paths, which produce content and positional features.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1040" height="430" rx="20" fill="#f8fafc"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="520" y="38" font-size="24" font-weight="700" fill="#0f172a">Low-rank MLA projections</text>
    <rect x="35" y="165" width="150" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="200" font-size="18" font-weight="600" fill="#1e3a8a">Hidden state X</text>
    <text x="110" y="228" font-size="16" fill="#1e3a8a">[B, T, 256]</text>
    <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
      <line x1="185" y1="205" x2="245" y2="120"/>
      <line x1="185" y1="215" x2="245" y2="305"/>
      <line x1="410" y1="120" x2="475" y2="120"/>
      <line x1="410" y1="305" x2="475" y2="305"/>
      <line x1="680" y1="120" x2="750" y2="78"/>
      <line x1="680" y1="120" x2="750" y2="162"/>
      <line x1="680" y1="305" x2="750" y2="270"/>
      <line x1="680" y1="305" x2="750" y2="350"/>
    </g>
    <rect x="245" y="75" width="165" height="90" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="327" y="108" font-size="17" font-weight="600" fill="#9a3412">Query down</text>
    <text x="327" y="135" font-size="16" fill="#9a3412">256 → 128</text>
    <rect x="245" y="260" width="165" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="327" y="293" font-size="17" font-weight="600" fill="#166534">KV down</text>
    <text x="327" y="320" font-size="16" fill="#166534">256 → 64 + 16</text>
    <rect x="475" y="75" width="205" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="577" y="108" font-size="17" font-weight="600" fill="#92400e">RMSNorm + Q up</text>
    <text x="577" y="135" font-size="16" fill="#92400e">128 → 8 × 48</text>
    <rect x="475" y="260" width="205" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="577" y="293" font-size="17" font-weight="600" fill="#92400e">RMSNorm + KV up</text>
    <text x="577" y="320" font-size="16" fill="#92400e">64 → 8 × (32 + 32)</text>
    <g>
      <rect x="750" y="40" width="235" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="867" y="70" font-size="16" font-weight="600" fill="#075985">Content Q</text>
      <text x="867" y="94" font-size="15" fill="#075985">8 × 32</text>
      <rect x="750" y="125" width="235" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="867" y="155" font-size="16" font-weight="600" fill="#5b21b6">Position Q</text>
      <text x="867" y="179" font-size="15" fill="#5b21b6">8 × 16, RoPE later</text>
      <rect x="750" y="235" width="235" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="867" y="265" font-size="16" font-weight="600" fill="#075985">Content K + V</text>
      <text x="867" y="289" font-size="15" fill="#075985">8 × (32 + 32)</text>
      <rect x="750" y="320" width="235" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="867" y="350" font-size="16" font-weight="600" fill="#5b21b6">Position K</text>
      <text x="867" y="374" font-size="15" fill="#5b21b6">shared 16, RoPE later</text>
    </g>
  </g>
</svg>
