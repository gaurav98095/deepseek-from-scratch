<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-labelledby="title desc">
  <title id="title">SwiGLU gated feed-forward network</title>
  <desc id="desc">The input is sent through gate and up projections, the gate uses SiLU, the branches multiply element-wise, and a down projection returns to the model dimension.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="920" height="310" rx="20" fill="#f8fafc"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="460" y="38" font-size="23" font-weight="700" fill="#0f172a">SwiGLU: gated feature transformation</text>
    <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
      <line x1="120" y1="155" x2="180" y2="105"/>
      <line x1="120" y1="155" x2="180" y2="215"/>
      <line x1="335" y1="105" x2="390" y2="105"/>
      <line x1="335" y1="215" x2="445" y2="215"/>
      <line x1="565" y1="155" x2="640" y2="155"/>
      <line x1="760" y1="155" x2="815" y2="155"/>
    </g>
    <rect x="35" y="115" width="85" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="77" y="148" font-size="17" font-weight="600" fill="#1e3a8a">Input</text>
    <text x="77" y="174" font-size="15" fill="#1e3a8a">D</text>
    <rect x="180" y="65" width="155" height="80" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="257" y="98" font-size="16" font-weight="600" fill="#9a3412">Gate projection</text>
    <text x="257" y="122" font-size="15" fill="#9a3412">D → I</text>
    <rect x="180" y="175" width="155" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="257" y="208" font-size="16" font-weight="600" fill="#166534">Up projection</text>
    <text x="257" y="232" font-size="15" fill="#166534">D → I</text>
    <rect x="390" y="65" width="150" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="465" y="98" font-size="16" font-weight="600" fill="#92400e">SiLU</text>
    <text x="465" y="122" font-size="15" fill="#92400e">SiLU(gate)</text>
    <circle cx="505" cy="215" r="40" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="505" y="222" font-size="27" font-weight="700" fill="#5b21b6">×</text>
    <rect x="640" y="115" width="120" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="700" y="148" font-size="16" font-weight="600" fill="#075985">Down</text>
    <text x="700" y="173" font-size="15" fill="#075985">I → D</text>
    <rect x="815" y="115" width="80" height="80" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="855" y="148" font-size="16" font-weight="600" fill="#9d174d">Output</text>
    <text x="855" y="173" font-size="15" fill="#9d174d">D</text>
    <text x="460" y="285" font-size="16" fill="#475569">element-wise gate * up, then project back to the model dimension</text>
  </g>
</svg>
