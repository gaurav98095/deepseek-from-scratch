<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek codebase setup flow</title>
  <desc id="desc">A flow from configuration and environment checks to the model skeleton, smoke test, backward pass, and unit tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".27"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#cbd5e1"/>
    </marker>
    <style>
      .title { font: 700 32px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 700 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .tiny { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1400" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1260" cy="80" r="190" fill="#38bdf8" opacity=".08"/>
  <circle cx="70" cy="610" r="180" fill="#c084fc" opacity=".08"/>

  <text x="70" y="68" class="title">A reliable development loop</text>
  <text x="70" y="101" class="subtitle">Configuration, model code, hardware checks, and tests should all work before the architecture grows.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="200" width="220" height="125" rx="20" fill="url(#blue)"/>
    <text x="190" y="245" text-anchor="middle" class="label">Configuration</text>
    <text x="190" y="274" text-anchor="middle" class="small">dimensions + limits</text>
    <text x="190" y="298" text-anchor="middle" class="small">model/config.py</text>

    <rect x="370" y="200" width="220" height="125" rx="20" fill="url(#green)"/>
    <text x="480" y="245" text-anchor="middle" class="label">Model skeleton</text>
    <text x="480" y="274" text-anchor="middle" class="small">embedding + LM head</text>
    <text x="480" y="298" text-anchor="middle" class="small">[B, T] → [B, T, V]</text>

    <rect x="660" y="200" width="220" height="125" rx="20" fill="url(#purple)"/>
    <text x="770" y="245" text-anchor="middle" class="label">Smoke test</text>
    <text x="770" y="274" text-anchor="middle" class="small">forward pass</text>
    <text x="770" y="298" text-anchor="middle" class="small">shapes + parameter count</text>

    <rect x="950" y="200" width="220" height="125" rx="20" fill="url(#orange)"/>
    <text x="1060" y="245" text-anchor="middle" class="label">Backward pass</text>
    <text x="1060" y="274" text-anchor="middle" class="small">loss + gradients</text>
    <text x="1060" y="298" text-anchor="middle" class="small">autograd works</text>

    <rect x="1090" y="445" width="220" height="125" rx="20" fill="url(#green)"/>
    <text x="1200" y="490" text-anchor="middle" class="label">Unit tests</text>
    <text x="1200" y="519" text-anchor="middle" class="small">shapes + limits</text>
    <text x="1200" y="543" text-anchor="middle" class="small">repeatable checks</text>

    <rect x="450" y="445" width="220" height="125" rx="20" fill="#334155" stroke="#94a3b8" stroke-opacity=".55"/>
    <text x="560" y="490" text-anchor="middle" class="label">Hardware check</text>
    <text x="560" y="519" text-anchor="middle" class="small">CUDA + BF16</text>
    <text x="560" y="543" text-anchor="middle" class="small">CPU fallback</text>
  </g>

  <path d="M300 262 H370" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M590 262 H660" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M880 262 H950" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1060 325 V400 H1200 V445" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M560 445 V390 H480 V325" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="520" y="383" text-anchor="middle" class="tiny">run on available device</text>
  <text x="1100" y="390" text-anchor="middle" class="tiny">automate the checks</text>

  <text x="700" y="630" text-anchor="middle" class="small">Once this loop is stable, attention, normalization, and expert layers can be added one piece at a time.</text>
</svg>
