<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
  <title id="title">Shared and routed expert paths</title>
  <desc id="desc">A token always runs through a shared expert and is manually or eventually routed to a subset of independent experts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .heading { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1100" height="440" rx="18" fill="#f8fafc"/>
  <text x="550" y="38" text-anchor="middle" class="title">One expert bank: shared computation plus independent routed experts</text>
  <rect x="35" y="75" width="170" height="70" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="120" y="105" text-anchor="middle" class="label">Token hidden state</text>
  <text x="120" y="126" text-anchor="middle" class="small">x ∈ Rᴰ</text>
  <line x1="205" y1="110" x2="270" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="75" width="180" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="105" text-anchor="middle" class="label">Shared Expert</text>
  <text x="360" y="126" text-anchor="middle" class="small">always active</text>
  <line x1="205" y1="110" x2="270" y2="290" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="270" y="255" width="180" height="70" rx="12" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="360" y="285" text-anchor="middle" class="label">Routed bank</text>
  <text x="360" y="306" text-anchor="middle" class="small">select a subset later</text>
  <line x1="450" y1="290" x2="520" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="290" x2="520" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="290" x2="520" y2="370" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="520" y="180" width="145" height="58" rx="10" fill="#bbf7d0"/>
  <text x="592" y="205" text-anchor="middle" class="label">Expert 1</text>
  <text x="592" y="223" text-anchor="middle" class="small">selected</text>
  <rect x="520" y="260" width="145" height="58" rx="10" fill="#bbf7d0"/>
  <text x="592" y="285" text-anchor="middle" class="label">Expert 4</text>
  <text x="592" y="303" text-anchor="middle" class="small">selected</text>
  <rect x="520" y="340" width="145" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="592" y="365" text-anchor="middle" class="label">Experts 0,2,3…</text>
  <text x="592" y="383" text-anchor="middle" class="small">inactive for x</text>
  <line x1="450" y1="110" x2="760" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="665" y1="209" x2="760" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="665" y1="289" x2="760" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="760" y="170" width="290" height="72" rx="12" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
  <text x="905" y="200" text-anchor="middle" class="label">Combine outputs</text>
  <text x="905" y="222" text-anchor="middle" class="small">shared + weighted routed paths</text>
  <text x="905" y="285" text-anchor="middle" class="heading">Only selected routed</text>
  <text x="905" y="310" text-anchor="middle" class="heading">experts receive gradients</text>
</svg>
