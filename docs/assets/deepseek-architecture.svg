<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-style language model architecture</title>
  <desc id="desc">A diagram showing token IDs flowing through embeddings, repeated Transformer blocks with MLA and dense or mixture-of-experts feed-forward paths, then RMSNorm and next-token logits.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="attention" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="moe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#cbd5e1"/>
    </marker>
    <marker id="smallArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .small { font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .tiny { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .block { stroke: #ffffff; stroke-opacity: .18; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#background)"/>
  <circle cx="1220" cy="70" r="180" fill="#38bdf8" opacity=".08"/>
  <circle cx="80" cy="700" r="220" fill="#a78bfa" opacity=".08"/>

  <text x="70" y="70" class="title">Inside a DeepSeek-style language model</text>
  <text x="70" y="105" class="subtitle">The sequence keeps its shape while each block adds context, capacity, and prediction power.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="170" height="100" rx="18" fill="url(#input)" class="block"/>
    <text x="155" y="290" text-anchor="middle" class="label">Token IDs</text>
    <text x="155" y="320" text-anchor="middle" class="small">[batch, sequence]</text>

    <rect x="290" y="250" width="190" height="100" rx="18" fill="url(#input)" class="block"/>
    <text x="385" y="290" text-anchor="middle" class="label">Embeddings</text>
    <text x="385" y="320" text-anchor="middle" class="small">[batch, seq, dim]</text>

    <rect x="530" y="180" width="420" height="250" rx="24" fill="#172033" stroke="#64748b" stroke-width="2"/>
    <text x="740" y="220" text-anchor="middle" class="label">Repeated Transformer block</text>
    <text x="740" y="246" text-anchor="middle" class="tiny">residual connections preserve the hidden-state shape</text>

    <rect x="570" y="270" width="155" height="100" rx="16" fill="url(#attention)" class="block"/>
    <text x="647" y="310" text-anchor="middle" class="label">MLA</text>
    <text x="647" y="338" text-anchor="middle" class="small">compressed KV</text>
    <text x="647" y="358" text-anchor="middle" class="small">+ decoupled RoPE</text>

    <rect x="765" y="270" width="155" height="100" rx="16" fill="url(#moe)" class="block"/>
    <text x="842" y="310" text-anchor="middle" class="label">FFN / MoE</text>
    <text x="842" y="338" text-anchor="middle" class="small">router selects</text>
    <text x="842" y="358" text-anchor="middle" class="small">a few experts</text>

    <rect x="1000" y="250" width="160" height="100" rx="18" fill="url(#output)" class="block"/>
    <text x="1080" y="290" text-anchor="middle" class="label">RMSNorm</text>
    <text x="1080" y="320" text-anchor="middle" class="small">final hidden state</text>

    <rect x="1210" y="250" width="130" height="100" rx="18" fill="url(#output)" class="block"/>
    <text x="1275" y="290" text-anchor="middle" class="label">Logits</text>
    <text x="1275" y="320" text-anchor="middle" class="small">next token</text>
  </g>

  <path d="M240 300 H290" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M480 300 H530" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M950 300 H1000" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1160 300 H1210" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M740 430 V490 H1080 V350" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#smallArrow)"/>
  <text x="860" y="520" text-anchor="middle" class="tiny">repeat N times</text>

  <g transform="translate(90 590)">
    <rect width="360" height="85" rx="16" fill="#0f766e" fill-opacity=".22" stroke="#2dd4bf" stroke-opacity=".6"/>
    <circle cx="30" cy="30" r="9" fill="#2dd4bf"/>
    <text x="55" y="36" class="label" font-size="17">MLA</text>
    <text x="30" y="62" class="small">reduces inference KV-cache memory</text>
  </g>
  <g transform="translate(520 590)">
    <rect width="360" height="85" rx="16" fill="#b45309" fill-opacity=".22" stroke="#fbbf24" stroke-opacity=".6"/>
    <circle cx="30" cy="30" r="9" fill="#fbbf24"/>
    <text x="55" y="36" class="label" font-size="17">DeepSeekMoE</text>
    <text x="30" y="62" class="small">increases capacity with sparse activation</text>
  </g>
  <g transform="translate(950 590)">
    <rect width="360" height="85" rx="16" fill="#7e22ce" fill-opacity=".22" stroke="#e879f9" stroke-opacity=".6"/>
    <circle cx="30" cy="30" r="9" fill="#e879f9"/>
    <text x="55" y="36" class="label" font-size="17">MTP</text>
    <text x="30" y="62" class="small">adds future-token training signals</text>
  </g>
</svg>
