<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Decoupled RoPE in MLA</title>
  <desc id="desc">Content query and key features bypass rotation while separate positional query and key features receive RoPE before the vectors are combined.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1040" height="360" rx="20" fill="#f8fafc"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="520" y="36" font-size="23" font-weight="700" fill="#0f172a">Decoupled positional path</text>
    <rect x="35" y="135" width="150" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="170" font-size="17" font-weight="600" fill="#1e3a8a">Projected Q/K</text>
    <text x="110" y="198" font-size="15" fill="#1e3a8a">split features</text>
    <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
      <line x1="185" y1="160" x2="265" y2="92"/>
      <line x1="185" y1="200" x2="265" y2="268"/>
      <line x1="440" y1="92" x2="520" y2="92"/>
      <line x1="440" y1="268" x2="520" y2="268"/>
      <line x1="700" y1="92" x2="785" y2="150"/>
      <line x1="700" y1="268" x2="785" y2="210"/>
    </g>
    <rect x="265" y="50" width="175" height="85" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="352" y="84" font-size="17" font-weight="600" fill="#075985">Content Q/K</text>
    <text x="352" y="111" font-size="15" fill="#075985">32 dimensions</text>
    <rect x="265" y="225" width="175" height="85" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="352" y="259" font-size="17" font-weight="600" fill="#5b21b6">Position Q/K</text>
    <text x="352" y="286" font-size="15" fill="#5b21b6">16 dimensions</text>
    <rect x="520" y="50" width="180" height="85" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="610" y="84" font-size="17" font-weight="600" fill="#166534">No rotation</text>
    <text x="610" y="111" font-size="15" fill="#166534">content preserved</text>
    <rect x="520" y="225" width="180" height="85" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="610" y="259" font-size="17" font-weight="600" fill="#92400e">Apply RoPE</text>
    <text x="610" y="286" font-size="15" fill="#92400e">relative position</text>
    <rect x="785" y="135" width="215" height="90" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="892" y="170" font-size="17" font-weight="600" fill="#9d174d">Concatenate</text>
    <text x="892" y="198" font-size="15" fill="#9d174d">Q/K = content + position</text>
  </g>
</svg>
