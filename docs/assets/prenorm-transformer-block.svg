<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="760" viewBox="0 0 1450 760" role="img" aria-labelledby="title desc">
  <title id="title">Pre-normalized DeepSeek Transformer block</title>
  <desc id="desc">An input residual stream passes through RMSNorm and attention, then adds a residual. A second RMSNorm and feed-forward branch follows before the block output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="norm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="attn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#047857"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="ffn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#cbd5e1"/></marker>
    <style>
      .title { font: 700 31px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 700 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .tiny { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1450" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="65" class="title">Pre-normalization keeps a clean residual path</text>
  <text x="70" y="98" class="subtitle">RMSNorm prepares each branch; the residual stream carries the original representation forward.</text>

  <g filter="url(#shadow)">
    <rect x="610" y="135" width="230" height="90" rx="18" fill="#334155" stroke="#cbd5e1" stroke-opacity=".6"/>
    <text x="725" y="175" text-anchor="middle" class="label">Input x</text>
    <text x="725" y="202" text-anchor="middle" class="small">residual stream</text>

    <rect x="610" y="285" width="230" height="90" rx="18" fill="url(#norm)"/>
    <text x="725" y="325" text-anchor="middle" class="label">RMSNorm</text>
    <text x="725" y="352" text-anchor="middle" class="small">normalize branch input</text>

    <rect x="610" y="435" width="230" height="90" rx="18" fill="url(#attn)"/>
    <text x="725" y="475" text-anchor="middle" class="label">Attention / MLA</text>
    <text x="725" y="502" text-anchor="middle" class="small">context mixing</text>

    <rect x="610" y="585" width="230" height="90" rx="18" fill="url(#ffn)"/>
    <text x="725" y="625" text-anchor="middle" class="label">RMSNorm → FFN / MoE</text>
    <text x="725" y="652" text-anchor="middle" class="small">feature transformation</text>
  </g>

  <path d="M725 225 V285" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M725 375 V435" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M725 525 V585" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M610 180 H430 V480 H610" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="390" y="330" text-anchor="middle" class="small" transform="rotate(-90 390 330)">residual add</text>

  <path d="M840 480 H1020 V630 H840" fill="none" stroke="#fde68a" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="1065" y="555" text-anchor="middle" class="small" transform="rotate(90 1065 555)">second residual add</text>

  <text x="1100" y="220" class="label">Equations</text>
  <text x="1100" y="260" class="small">h = x + Attention(RMSNorm(x))</text>
  <text x="1100" y="300" class="small">y = h + FFN(RMSNorm(h))</text>
  <text x="1100" y="350" class="tiny">The residual additions preserve a direct path for information and gradients.</text>
</svg>
