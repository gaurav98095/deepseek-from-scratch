<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="280" viewBox="0 0 1020 280" role="img" aria-labelledby="title desc">
  <title id="title">Resumable pretraining checkpoint lifecycle</title>
  <desc id="desc">Training produces latest and best checkpoints, and a restart restores model, optimizer, sampler, and random state before continuing.</desc>
  <rect width="1020" height="280" rx="20" fill="#0f172a"/>
  <text x="510" y="34" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="700">A checkpoint is the whole training state</text>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle"><rect x="35" y="96" width="180" height="70" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="125" y="126" fill="#bae6fd">Optimizer step</text><text x="125" y="150" fill="#e2e8f0">model + sampler + RNG</text><rect x="275" y="70" width="175" height="55" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/><text x="362" y="103" fill="#bbf7d0">latest.pt</text><rect x="275" y="137" width="175" height="55" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text x="362" y="170" fill="#fef3c7">best.pt</text><rect x="510" y="96" width="190" height="70" rx="13" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="605" y="126" fill="#ddd6fe">Process restarts</text><text x="605" y="150" fill="#e2e8f0">load + validate settings</text><rect x="760" y="96" width="220" height="70" rx="13" fill="#1e293b" stroke="#fb7185" stroke-width="2"/><text x="870" y="126" fill="#fecdd3">Continue step N + 1</text><text x="870" y="150" fill="#e2e8f0">same schedule and samples</text></g>
  <g fill="none" stroke="#94a3b8" stroke-width="2"><path d="M215 131h60M450 104h60M450 164h60M700 131h60"/></g><g fill="#94a3b8"><path d="M265 131l-9-6v12z"/><path d="M500 104l-9-6v12z"/><path d="M500 164l-9-6v12z"/><path d="M750 131l-9-6v12z"/></g>
  <text x="510" y="230" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">latest.pt resumes work; best.pt preserves the lowest fixed validation loss</text>
</svg>
