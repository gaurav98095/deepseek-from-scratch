<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Byte Pair Encoding merge process</title>
  <desc id="desc">The words low, lower, and lowest are progressively merged from characters into lo and then low.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#3f1d0b"/>
    </linearGradient>
    <linearGradient id="before" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="after" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#fde68a"/>
    </marker>
    <style>
      .title { font: 700 31px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 700 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .tiny { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1400" height="700" rx="28" fill="url(#bg)"/>
  <text x="70" y="65" class="title">BPE learns frequent adjacent pairs</text>
  <text x="70" y="98" class="subtitle">Each merge creates a new token and rewrites every matching pair in the training corpus.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="280" height="360" rx="22" fill="#172554" stroke="#60a5fa" stroke-opacity=".6"/>
    <text x="210" y="215" text-anchor="middle" class="label">Initial tokens</text>
    <text x="210" y="246" text-anchor="middle" class="tiny">one character per token</text>
    <g transform="translate(115 285)">
      <rect width="190" height="42" rx="10" fill="url(#before)"/><text x="95" y="27" text-anchor="middle" class="label">l o w</text>
      <rect y="55" width="190" height="42" rx="10" fill="url(#before)"/><text x="95" y="82" text-anchor="middle" class="label">l o w e r</text>
      <rect y="110" width="190" height="42" rx="10" fill="url(#before)"/><text x="95" y="137" text-anchor="middle" class="label">l o w e s t</text>
    </g>
    <text x="210" y="485" text-anchor="middle" class="small">(l, o) and (o, w) appear often</text>

    <rect x="560" y="170" width="280" height="360" rx="22" fill="#451a03" stroke="#fbbf24" stroke-opacity=".7"/>
    <text x="700" y="215" text-anchor="middle" class="label">Merge 1</text>
    <text x="700" y="246" text-anchor="middle" class="tiny">choose (l, o) → lo</text>
    <g transform="translate(605 285)">
      <rect width="190" height="42" rx="10" fill="url(#after)"/><text x="95" y="27" text-anchor="middle" class="label">lo w</text>
      <rect y="55" width="190" height="42" rx="10" fill="url(#after)"/><text x="95" y="82" text-anchor="middle" class="label">lo w e r</text>
      <rect y="110" width="190" height="42" rx="10" fill="url(#after)"/><text x="95" y="137" text-anchor="middle" class="label">lo w e s t</text>
    </g>
    <text x="700" y="485" text-anchor="middle" class="small">a new token, lo, is added</text>

    <rect x="1050" y="170" width="280" height="360" rx="22" fill="#451a03" stroke="#fbbf24" stroke-opacity=".7"/>
    <text x="1190" y="215" text-anchor="middle" class="label">Merge 2</text>
    <text x="1190" y="246" text-anchor="middle" class="tiny">choose (lo, w) → low</text>
    <g transform="translate(1095 285)">
      <rect width="190" height="42" rx="10" fill="url(#after)"/><text x="95" y="27" text-anchor="middle" class="label">low</text>
      <rect y="55" width="190" height="42" rx="10" fill="url(#after)"/><text x="95" y="82" text-anchor="middle" class="label">low e r</text>
      <rect y="110" width="190" height="42" rx="10" fill="url(#after)"/><text x="95" y="137" text-anchor="middle" class="label">low e s t</text>
    </g>
    <text x="1190" y="485" text-anchor="middle" class="small">low becomes one learned token</text>
  </g>

  <path d="M350 350 H560" stroke="#fde68a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M840 350 H1050" stroke="#fde68a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="455" y="330" text-anchor="middle" class="tiny">most frequent pair</text>
  <text x="945" y="330" text-anchor="middle" class="tiny">most frequent pair</text>

  <text x="700" y="620" text-anchor="middle" class="small">BPE learns statistical patterns; it does not assign semantic meaning to the new tokens.</text>
</svg>
