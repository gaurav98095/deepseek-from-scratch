<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Top-k routing and sparse token dispatch</title>
  <desc id="desc">Tokens are scored by a router, grouped by selected expert, processed, and scatter-added back to their original positions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .heading { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1120" height="470" rx="18" fill="#f8fafc"/>
  <text x="560" y="38" text-anchor="middle" class="title">Top-k routing turns one token batch into expert-specific batches</text>
  <rect x="30" y="80" width="190" height="115" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="125" y="112" text-anchor="middle" class="heading">Flatten tokens</text>
  <text x="125" y="142" text-anchor="middle" class="label">[B,T,D] → [B·T,D]</text>
  <text x="125" y="169" text-anchor="middle" class="small">one row per token</text>
  <line x1="220" y1="137" x2="275" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="275" y="80" width="190" height="115" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="370" y="112" text-anchor="middle" class="heading">Router</text>
  <text x="370" y="142" text-anchor="middle" class="label">sigmoid scores</text>
  <text x="370" y="169" text-anchor="middle" class="small">top-k IDs + weights</text>
  <line x1="465" y1="137" x2="520" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="80" width="210" height="115" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="625" y="112" text-anchor="middle" class="heading">Dispatch</text>
  <text x="625" y="142" text-anchor="middle" class="label">index_select</text>
  <text x="625" y="169" text-anchor="middle" class="small">group rows by expert</text>
  <line x1="730" y1="137" x2="785" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="785" y="80" width="300" height="115" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="935" y="112" text-anchor="middle" class="heading">Expert-specific batches</text>
  <text x="935" y="142" text-anchor="middle" class="label">E1: tokens 0,2,5</text>
  <text x="935" y="169" text-anchor="middle" class="label">E4: tokens 0,4</text>
  <path d="M935 195 L935 260 L625 260 L625 300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="300" width="310" height="75" rx="14" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
  <text x="625" y="331" text-anchor="middle" class="heading">Run selected experts</text>
  <text x="625" y="354" text-anchor="middle" class="small">only assigned rows are executed</text>
  <path d="M470 337 L190 337 L190 260 L290 260" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="240" width="260" height="115" rx="14" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
  <text x="160" y="272" text-anchor="middle" class="heading">Aggregate</text>
  <text x="160" y="302" text-anchor="middle" class="label">weighted outputs</text>
  <text x="160" y="329" text-anchor="middle" class="small">index_add to original rows</text>
  <line x1="290" y1="297" x2="430" y2="337" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="430" text-anchor="middle" class="small">The shared expert output is added for every token before the routed contributions.</text>
</svg>
