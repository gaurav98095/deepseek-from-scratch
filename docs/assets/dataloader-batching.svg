<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="650" viewBox="0 0 1450 650" role="img" aria-labelledby="title desc">
  <title id="title">Data loader windows becoming a training batch</title>
  <desc id="desc">A memory-mapped token file feeds a dataset that slices T plus one tokens, shifts them into input and target tensors, batches them, and transfers them to the GPU.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="dataset" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#047857"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="batch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7e22ce"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#cbd5e1"/></marker>
    <style>
      .title { font: 700 31px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .tiny { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1450" height="650" rx="28" fill="url(#bg)"/>
  <circle cx="1330" cy="80" r="190" fill="#38bdf8" opacity=".08"/>
  <circle cx="70" cy="570" r="180" fill="#a78bfa" opacity=".08"/>
  <text x="70" y="65" class="title">From token file to GPU batch</text>
  <text x="70" y="98" class="subtitle">Only the selected T + 1 tokens are copied from disk for each example.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="210" width="230" height="145" rx="20" fill="url(#disk)"/>
    <text x="175" y="255" text-anchor="middle" class="label">train.bin</text>
    <text x="175" y="285" text-anchor="middle" class="small">np.memmap</text>
    <text x="175" y="314" text-anchor="middle" class="tiny">long token stream on disk</text>

    <rect x="350" y="210" width="230" height="145" rx="20" fill="url(#dataset)"/>
    <text x="465" y="255" text-anchor="middle" class="label">Dataset</text>
    <text x="465" y="285" text-anchor="middle" class="small">start + stride</text>
    <text x="465" y="314" text-anchor="middle" class="tiny">slice T + 1 tokens</text>

    <rect x="640" y="210" width="230" height="145" rx="20" fill="url(#dataset)"/>
    <text x="755" y="255" text-anchor="middle" class="label">Shift</text>
    <text x="755" y="285" text-anchor="middle" class="small">x = chunk[:-1]</text>
    <text x="755" y="314" text-anchor="middle" class="tiny">y = chunk[1:]</text>

    <rect x="930" y="210" width="230" height="145" rx="20" fill="url(#batch)"/>
    <text x="1045" y="255" text-anchor="middle" class="label">DataLoader</text>
    <text x="1045" y="285" text-anchor="middle" class="small">batch + shuffle</text>
    <text x="1045" y="314" text-anchor="middle" class="tiny">X, Y: [B, T]</text>

    <rect x="1220" y="210" width="170" height="145" rx="20" fill="url(#gpu)"/>
    <text x="1305" y="255" text-anchor="middle" class="label">GPU</text>
    <text x="1305" y="285" text-anchor="middle" class="small">pinned copy</text>
    <text x="1305" y="314" text-anchor="middle" class="tiny">model + loss</text>
  </g>

  <path d="M290 282 H350" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M580 282 H640" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M870 282 H930" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1160 282 H1220" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(220 500)">
    <rect width="1010" height="72" rx="16" fill="#0f172a" fill-opacity=".6" stroke="#94a3b8" stroke-opacity=".35"/>
    <text x="505" y="29" text-anchor="middle" class="label" font-size="17">The DataLoader does not load the whole corpus</text>
    <text x="505" y="52" text-anchor="middle" class="small">It repeatedly samples small windows and assembles them into training batches.</text>
  </g>
</svg>
