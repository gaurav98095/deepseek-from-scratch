<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Two-dimensional vector rotation</title>
  <desc id="desc">A vector pointing right rotates forty-five degrees around the origin.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="orange-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="760" height="300" rx="18" fill="#f8fafc"/>
  <g transform="translate(170 160)">
    <circle r="95" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/>
    <line x1="-120" y1="0" x2="130" y2="0" stroke="#94a3b8"/>
    <line x1="0" y1="110" x2="0" y2="-120" stroke="#94a3b8"/>
    <line x1="0" y1="0" x2="92" y2="0" stroke="#2563eb" stroke-width="6" marker-end="url(#blue-arrow)"/>
    <line x1="0" y1="0" x2="65" y2="-65" stroke="#ea580c" stroke-width="6" marker-end="url(#orange-arrow)"/>
    <path d="M45 0 A45 45 0 0 0 32 -32" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="96" y="18" font-family="sans-serif" font-size="18" fill="#1d4ed8">x = [1, 0]</text>
    <text x="68" y="-72" font-family="sans-serif" font-size="18" fill="#c2410c">R(45°)x</text>
    <text x="30" y="-15" font-family="sans-serif" font-size="16" fill="#475569">45°</text>
  </g>
  <text x="390" y="110" font-family="sans-serif" font-size="22" font-weight="600" fill="#0f172a">Rotation changes direction</text>
  <text x="390" y="145" font-family="sans-serif" font-size="18" fill="#475569">but preserves vector length.</text>
  <text x="390" y="195" font-family="monospace" font-size="17" fill="#0f172a">[1, 0] → [0.707, 0.707]</text>
</svg>
