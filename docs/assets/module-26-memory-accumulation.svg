<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">Training memory and gradient accumulation</title>
  <desc id="desc">Weights, gradients, optimizer state, and activations contribute to memory while multiple microbatches share one optimizer update.</desc>
  <rect width="980" height="300" rx="20" fill="#0f172a"/>
  <text x="490" y="34" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="700">Fit the model, then increase the effective batch</text>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle"><text x="235" y="70" fill="#cbd5e1">Memory sources</text><rect x="50" y="85" width="370" height="34" rx="7" fill="#38bdf8"/><rect x="50" y="119" width="370" height="34" rx="7" fill="#a78bfa"/><rect x="50" y="153" width="370" height="34" rx="7" fill="#34d399"/><rect x="50" y="187" width="370" height="50" rx="7" fill="#fbbf24"/><text x="235" y="107" fill="#082f49">weights</text><text x="235" y="141" fill="#2e1065">gradients</text><text x="235" y="175" fill="#052e16">AdamW state</text><text x="235" y="216" fill="#451a03">activations — reduced by checkpointing</text>
  <text x="730" y="70" fill="#cbd5e1">One optimizer update</text><rect x="535" y="90" width="120" height="45" rx="9" fill="#1e293b" stroke="#38bdf8"/><rect x="680" y="90" width="120" height="45" rx="9" fill="#1e293b" stroke="#38bdf8"/><rect x="825" y="90" width="120" height="45" rx="9" fill="#1e293b" stroke="#38bdf8"/><text x="595" y="117" fill="#bae6fd">microbatch 1</text><text x="740" y="117" fill="#bae6fd">microbatch 2</text><text x="885" y="117" fill="#bae6fd">microbatch 3…</text><path d="M595 145v35M740 145v35M885 145v35" stroke="#94a3b8"/><path d="M595 180h290" stroke="#94a3b8"/><path d="M885 180l-9-6v12z" fill="#94a3b8"/><rect x="650" y="200" width="170" height="45" rx="9" fill="#1e293b" stroke="#fb7185"/><text x="735" y="227" fill="#fecdd3">clip + AdamW</text></g>
  <text x="490" y="275" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Accumulation increases tokens per update without retaining every microbatch activation</text>
</svg>
